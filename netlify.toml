# Static site: no build step. Netlify Forms collects the "serve-connect" form
# (Netlify dashboard > Forms; download as CSV to open in Excel).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
